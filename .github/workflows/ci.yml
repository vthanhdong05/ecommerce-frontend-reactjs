name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: "20"

jobs:
  # ============================================
  # JOB 1: Validate PR Base Branch
  # Chỉ chạy khi PR vào main - đảm bảo merge từ develop
  # ============================================
  validate-pr-base:
    name: Validate PR Base Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR base branch
        run: |
          if [ "${{ github.base_ref }}" == "main" ]; then
            if [ "${{ github.head_ref }}" != "develop" ]; then
              echo "❌ Error: PR vào main phải từ nhánh develop!"
              echo "   Base: ${{ github.base_ref }}"
              echo "   Head: ${{ github.head_ref }}"
              exit 1
            fi
          fi
          echo "✅ PR base branch validated"

  # ============================================
  # JOB 2: Code Quality Checks (Parallel)
  # ============================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier format
        run: npm run format:check

  # ============================================
  # JOB 3: TypeScript Compilation
  # ============================================
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc -b

  # ============================================
  # JOB 4: Build
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

  # ============================================
  # JOB 5: Tests
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test

      - name: Run Tests with Coverage
        run: npm run test:coverage

  # ============================================
  # JOB 6: Commit Message Check (chỉ khi push trực tiếp)
  # ============================================
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: |
          npx commitlint --last --verbose

      - name: Check commit messages since last tag
        if: github.event_name == 'push'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "Checking commits since tag: $LAST_TAG"
            npx commitlint --from "$LAST_TAG" --to HEAD --verbose
          else
            echo "No tags found, checking all commits"
            npx commitlint --from HEAD~10 --to HEAD --verbose
          fi

  # ============================================
  # JOB 7: Security Audit (Optional)
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

